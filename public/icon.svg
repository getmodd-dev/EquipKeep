<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <!-- Orange / Amber Emblem Gradient -->
    <linearGradient id="emblemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <!-- Subtle Inner Glow -->
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadow Filter for Wrench Emblem -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base App Tile Background with Rounded Corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="112" fill="none" stroke="#27272a" stroke-width="4" />

  <!-- Center Hexagonal / Shield Base Accent -->
  <rect x="76" y="76" width="360" height="360" rx="84" fill="url(#emblemGrad)" filter="url(#shadow)" />
  <rect x="76" y="76" width="360" height="360" rx="84" fill="url(#sheen)" />
  <rect x="76" y="76" width="360" height="360" rx="84" fill="none" stroke="#fdba74" stroke-width="2" stroke-opacity="0.4" />

  <!-- EquipKeep Logo Icon: Combination Wrench & Gear / Maintenance Motif -->
  <!-- Crisp white silhouette centered in safe-zone -->
  <g transform="translate(146, 146) scale(0.43)" fill="#ffffff" filter="drop-shadow(0px 6px 10px rgba(0,0,0,0.35))">
    <!-- Combination Wrench angled at 45 degrees -->
    <path d="M470.6 105.4c12.5 12.5 12.5 32.8 0 45.3l-23.3 23.3c-25 25-65.5 25-90.5 0l-17-17-142.1 142.1 14.1 14.1c12.5 12.5 12.5 32.8 0 45.3s-32.8 12.5-45.3 0L142.6 334.6c-12.5-12.5-12.5-32.8 0-45.3s32.8-12.5 45.3 0l14.1 14.1 142.1-142.1-17-17c-25-25-25-65.5 0-90.5l23.3-23.3c12.5-12.5 32.8-12.5 45.3 0l22.6 22.6 38.6-38.6c6.2-6.2 16.4-6.2 22.6 0l11.3 11.3c6.2 6.2 6.2 16.4 0 22.6l-38.6 38.6 22.6 22.6zM77.3 434.7c-40.4-40.4-40.4-105.9 0-146.3 10.9-10.9 24.3-18.6 38.8-22.9l60.3 60.3-17 17c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0l17-17 60.3 60.3c-4.3 14.5-12 27.9-22.9 38.8-40.4 40.4-105.9 40.4-146.3 0l-35.5-35.5z"/>
  </g>

  <!-- High-contrast small badge indicator in top right for homelab status -->
  <circle cx="396" cy="116" r="18" fill="#10b981" stroke="#18181b" stroke-width="6" />
</svg>
